<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Watch — Destination Redesign v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #FAF8F4; color: #1A1410; font-family: 'DM Sans', sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #FAF8F4; }
  ::-webkit-scrollbar-thumb { background: #D4CBBF; border-radius: 3px; }
  input, textarea, button, select { font-family: inherit; }
  @keyframes vwbFade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="../tweaks-panel.jsx"></script>
<script type="text/babel">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "destinationStyle": "segmented",
  "showStepNumbers": true,
  "preview": "mobile"
}/*EDITMODE-END*/;

// ── Tokens ────────────────────────────────────────────────────────────────
const C = {
  bg: '#FAF8F4', imgBg: '#F5F2EC', ink: '#1A1410', muted: '#A89880', gold: '#C9A84C',
  border: '#EAE5DC', borderMid: '#E8E2D8', specDiv: '#F0EBE3', borderLight: '#D4CBBF',
  disabled: '#C8BFAF', white: '#FFFFFF', ownBg: '#E8F4E8', ownText: '#2D6A2D',
  serif: "'Cormorant Garamond', serif", sans: "'DM Sans', sans-serif",
};

const fmt = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 }).format(n);

const WATCH = {
  brand: 'IWC Schaffhausen', model: "Big Pilot's Watch 43", reference: 'IW329301',
  caseMaterial: 'Stainless Steel', dialColor: 'Black', caseSizeMm: 43,
  watchType: 'Pilot', movement: 'Calibre 82100', complications: ['Date'],
  estimatedValue: 7600, notes: 'Oversized crown', imageUrl: '../assets/watches/longines-04.avif',
};
const PLAYGROUND_BOXES = [
  { id: 'box1', name: 'Dream Collection', count: 5 },
  { id: 'box2', name: 'Under $10K', count: 5 },
  { id: 'box3', name: 'Travel Box', count: 3 },
];
const CONDITIONS = ['Unworn', 'Like New', 'Excellent', 'Good', 'Fair'];

// ── Small shared bits ──────────────────────────────────────────────────────
const eyebrow = { fontSize: 9, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: C.muted };

function StepHeading({ n, children, show }) {
  return (
    <div style={{ display: 'flex', alignItems: 'center', gap: 9, marginBottom: 10 }}>
      {show && (
        <span style={{ width: 18, height: 18, borderRadius: '50%', border: `1px solid ${C.borderLight}`,
          display: 'inline-flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 10, fontWeight: 600, color: C.muted, flexShrink: 0 }}>{n}</span>
      )}
      <span style={eyebrow}>{children}</span>
    </div>
  );
}

// ── NavBar ──────────────────────────────────────────────────────────────────
function NavBar() {
  return (
    <nav style={{ borderBottom: `1px solid ${C.border}`, background: C.bg, position: 'sticky', top: 0, zIndex: 50 }}>
      <div style={{ maxWidth: 1280, margin: '0 auto', display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '20px 56px' }}>
        <span style={{ fontFamily: C.serif, fontSize: 20, fontWeight: 500, letterSpacing: '0.03em' }}>Virtual Watchbox</span>
        <div style={{ display: 'flex', gap: 32 }}>
          {['My Collection', 'Playground', 'Discover', 'News'].map(l => (
            <a key={l} style={{ fontSize: 12, letterSpacing: '0.04em', color: C.muted, textDecoration: 'none', cursor: 'pointer' }}>{l}</a>
          ))}
        </div>
        <button style={{ fontSize: 11, fontWeight: 500, letterSpacing: '0.08em', padding: '9px 22px', background: C.ink, color: C.bg, border: 'none', borderRadius: 4, cursor: 'pointer' }}>Sign In</button>
      </div>
    </nav>
  );
}

// ── Watch image ─────────────────────────────────────────────────────────────
function WatchImage({ followed, onFollow, mobile }) {
  return (
    <div style={{ position: 'relative', background: C.imgBg, border: `1px solid ${C.border}`, borderRadius: 16, overflow: 'hidden', aspectRatio: '1/1' }}>
      <img src={WATCH.imageUrl} alt={WATCH.model}
        style={{ width: '100%', height: '100%', objectFit: 'contain', padding: mobile ? 22 : 32, display: 'block', filter: 'drop-shadow(0 16px 32px rgba(26,20,16,0.18))' }} />
      <button onClick={onFollow} title={followed ? 'Saved to Followed Watches' : 'Follow this watch'}
        style={{ position: 'absolute', top: 14, right: 14, width: 38, height: 38, borderRadius: '50%',
          background: followed ? 'rgba(201,168,76,0.18)' : 'rgba(250,248,244,0.80)', backdropFilter: 'blur(8px)',
          border: followed ? '1px solid rgba(201,168,76,0.55)' : '1px solid rgba(212,203,191,0.7)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer', transition: 'all 0.18s ease',
          boxShadow: '0 2px 8px rgba(26,20,16,0.07)' }}>
        <svg width="16" height="16" viewBox="0 0 24 24" fill={followed ? C.gold : 'none'} stroke={followed ? C.gold : C.ink} strokeWidth="1.6" strokeLinejoin="round">
          <path d="M12 20.5s-6.8-4.35-9.22-8.05C.92 9.63 2.03 5.5 6.2 5.5c2.07 0 3.34 1.07 4.16 2.28.82-1.21 2.09-2.28 4.16-2.28 4.17 0 5.28 4.13 3.42 6.95C18.8 16.15 12 20.5 12 20.5z" />
        </svg>
      </button>
    </div>
  );
}

// ── Watch header ────────────────────────────────────────────────────────────
function WatchHeader() {
  return (
    <div style={{ marginBottom: 20 }}>
      <div style={{ ...eyebrow, fontWeight: 500, letterSpacing: '0.14em', marginBottom: 14, display: 'flex', alignItems: 'center', gap: 8 }}>
        <span style={{ display: 'inline-block', width: 16, height: 1, background: C.borderLight }}></span>
        Add a Watch
      </div>
      <div style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.14em', textTransform: 'uppercase', color: C.gold, marginBottom: 8 }}>{WATCH.brand}</div>
      <h1 style={{ fontFamily: C.serif, fontSize: 44, fontWeight: 400, lineHeight: 0.95, color: C.ink, marginBottom: 10 }}>{WATCH.model}</h1>
      <div style={{ fontSize: 13, color: C.muted, marginBottom: 16, letterSpacing: '0.02em' }}>{WATCH.reference}</div>
      <div style={{ display: 'flex', flexWrap: 'wrap', fontSize: 13, color: C.ink, lineHeight: 1.5 }}>
        <span>{WATCH.caseMaterial}</span>
        <span style={{ margin: '0 10px', color: C.borderLight }}>|</span>
        <span>Dial: {WATCH.dialColor}</span>
        <span style={{ margin: '0 10px', color: C.borderLight }}>|</span>
        <span>{WATCH.caseSizeMm} mm</span>
      </div>
    </div>
  );
}

function EstValue() {
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', gap: 10, paddingBottom: 20, marginBottom: 20, borderBottom: `1px solid ${C.border}` }}>
      <span style={{ fontFamily: C.serif, fontSize: 38, fontWeight: 400, color: C.gold, lineHeight: 1 }}>{fmt(WATCH.estimatedValue)}</span>
      <span style={{ fontSize: 10, fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.muted }}>Est. Market Value</span>
    </div>
  );
}

function SpecsBlock() {
  const specs = [
    ['Watch Type', WATCH.watchType], ['Movement', WATCH.movement],
    ['Complications', WATCH.complications.join(', ') || '—'], ['Case Material', WATCH.caseMaterial],
    ['Dial Color', WATCH.dialColor], ['Case Size', `${WATCH.caseSizeMm}mm`],
  ];
  return (
    <div>
      {specs.map(([l, v]) => (
        <div key={l} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'baseline', padding: '8px 0', borderBottom: `1px solid ${C.specDiv}` }}>
          <span style={{ fontSize: 11, color: C.muted }}>{l}</span>
          <span style={{ fontSize: 11, color: C.ink, fontWeight: 500, textAlign: 'right' }}>{v}</span>
        </div>
      ))}
      {WATCH.notes && <div style={{ fontSize: 11, color: C.gold, fontStyle: 'italic', paddingTop: 10 }}>"{WATCH.notes}"</div>}
    </div>
  );
}

// ════════════════════════════════════════════════════════════════════════════
//  DESTINATION CONTROL — three directions
// ════════════════════════════════════════════════════════════════════════════

// Direction A — identity-language segmented switch (RECOMMENDED)
// Reads unmistakably as a toggle: joined track + sliding thumb, no verb "Add".
function SegmentedDestination({ choice, setChoice, compact }) {
  const opts = [
    { id: 'owned', title: 'I Own This', sub: compact ? 'My Collection' : 'Goes to My Collection' },
    { id: 'playground', title: 'Just Dreaming', sub: compact ? 'Playground box' : 'Saves to a Playground box' },
  ];
  const idx = choice === 'playground' ? 1 : 0;
  const titleSize = compact ? 17 : 19;
  const pad = compact ? '12px 13px' : '13px 16px';
  return (
    <div>
      <div style={{ position: 'relative', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 0,
        background: C.specDiv, border: `1px solid ${C.borderMid}`, borderRadius: 12, padding: 4 }}>
        <div style={{ position: 'absolute', top: 4, bottom: 4, left: `calc(4px + ${idx} * (50% - 4px))`,
          width: 'calc(50% - 4px)', background: C.ink, borderRadius: 9,
          boxShadow: '0 4px 16px rgba(26,20,16,0.18)', transition: 'left 0.22s cubic-bezier(.4,0,.2,1)' }}></div>
        {opts.map((o, i) => {
          const active = idx === i;
          return (
            <button key={o.id} onClick={() => setChoice(o.id)}
              style={{ position: 'relative', zIndex: 1, background: 'transparent', border: 'none', cursor: 'pointer',
                textAlign: 'left', padding: pad, borderRadius: 9, transition: 'color 0.18s ease' }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 3 }}>
                <span style={{ width: 13, height: 13, borderRadius: '50%', flexShrink: 0,
                  border: active ? '4px solid ' + C.gold : `1.5px solid ${C.borderLight}`, background: active ? C.ink : 'transparent',
                  transition: 'all 0.18s ease' }}></span>
                <span style={{ fontFamily: C.serif, fontSize: titleSize, fontWeight: 400, lineHeight: 1.1,
                  color: active ? C.bg : C.ink }}>{o.title}</span>
              </div>
              <div style={{ fontSize: 10.5, letterSpacing: '0.03em', paddingLeft: 20,
                color: active ? 'rgba(250,248,244,0.6)' : C.muted }}>{o.sub}</div>
            </button>
          );
        })}
      </div>
      <div style={{ fontSize: 11, color: C.muted, marginTop: 9, lineHeight: 1.5 }}>
        Pick where it lives — you'll confirm with the button below.
      </div>
    </div>
  );
}

// Direction C — destination as an obvious form field (native select)
function DropdownDestination({ choice, setChoice }) {
  return (
    <div>
      <div style={{ position: 'relative' }}>
        <select value={choice} onChange={e => setChoice(e.target.value)}
          style={{ appearance: 'none', WebkitAppearance: 'none', width: '100%', padding: '13px 40px 13px 15px',
            border: `1px solid ${C.borderMid}`, borderRadius: 8, background: C.white, color: C.ink,
            fontSize: 14, fontWeight: 500, cursor: 'pointer', outline: 'none' }}>
          <option value="owned">My Collection — a watch I own</option>
          <option value="playground">Playground — a dream / wishlist box</option>
        </select>
        <span style={{ position: 'absolute', right: 15, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', color: C.muted }}>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 9l6 6 6-6" /></svg>
        </span>
      </div>
      <div style={{ fontSize: 11, color: C.muted, marginTop: 9 }}>Choose a destination, then fill in the details below.</div>
    </div>
  );
}

// Direction B — single default path; playground is a quiet text switch
function QuietSwitchHeader({ choice, setChoice }) {
  const owned = choice === 'owned';
  return (
    <div style={{ display: 'flex', alignItems: 'baseline', flexWrap: 'wrap', gap: '4px 8px', marginBottom: 4 }}>
      <span style={{ fontSize: 13, color: C.ink }}>
        {owned ? 'Adding to ' : 'Saving to a Playground box, '}
        {owned && <span style={{ fontWeight: 600 }}>My Collection.</span>}
        {!owned && <span style={{ fontWeight: 600 }}>your dream list.</span>}
      </span>
      <button onClick={() => setChoice(owned ? 'playground' : 'owned')}
        style={{ background: 'none', border: 'none', cursor: 'pointer', padding: 0, color: C.gold,
          fontSize: 12, fontWeight: 600, letterSpacing: '0.01em', display: 'inline-flex', alignItems: 'center', gap: 4 }}>
        {owned ? 'Just dreaming instead?' : 'Actually, I own it'}
        <span style={{ fontSize: 13 }}>→</span>
      </button>
    </div>
  );
}

// ── Condition picker ────────────────────────────────────────────────────────
function ConditionPicker({ condition, setCondition, showStep, step }) {
  return (
    <div>
      <StepHeading n={step} show={showStep}>Condition</StepHeading>
      <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap' }}>
        {CONDITIONS.map(c => {
          const active = condition === c;
          return (
            <button key={c} onClick={() => setCondition(c)}
              style={{ padding: '8px 14px', borderRadius: 20, cursor: 'pointer',
                border: active ? `1.5px solid ${C.ink}` : `1px solid ${C.borderMid}`,
                background: active ? C.ink : C.white, color: active ? C.bg : C.ink,
                fontSize: 11, fontWeight: 500, transition: 'all 0.15s ease' }}>{c}</button>
          );
        })}
      </div>
    </div>
  );
}

function PurchaseDetails() {
  const [open, setOpen] = useState(false);
  const inputStyle = { width: '100%', padding: '10px 12px', border: `1px solid ${C.borderMid}`, borderRadius: 6, fontSize: 13, color: C.ink, background: C.white, outline: 'none' };
  return (
    <div>
      <button onClick={() => setOpen(o => !o)}
        style={{ fontSize: 11, color: C.muted, background: 'none', border: 'none', cursor: 'pointer', padding: 0, letterSpacing: '0.04em', display: 'flex', alignItems: 'center', gap: 6 }}>
        <span style={{ fontSize: 14, lineHeight: 1, color: C.gold }}>{open ? '−' : '+'}</span>
        {open ? 'Hide purchase details' : 'Add purchase details'}
      </button>
      {open && (
        <div style={{ display: 'grid', gap: 8, marginTop: 12 }}>
          <input type="number" placeholder="Purchase price" style={inputStyle} />
          <input type="date" style={inputStyle} />
          <textarea rows="2" placeholder="Notes (optional)" style={{ ...inputStyle, resize: 'vertical' }}></textarea>
        </div>
      )}
    </div>
  );
}

function BoxPicker({ selectedBoxId, setSelectedBoxId, showStep, step }) {
  const [newBoxOpen, setNewBoxOpen] = useState(false);
  const [newBoxName, setNewBoxName] = useState('');
  return (
    <div>
      <StepHeading n={step} show={showStep}>Choose a Playground Box</StepHeading>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 6, marginBottom: 10 }}>
        {PLAYGROUND_BOXES.map(box => {
          const active = selectedBoxId === box.id;
          return (
            <button key={box.id} onClick={() => setSelectedBoxId(box.id)}
              style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', width: '100%',
                padding: '12px 14px', borderRadius: 8, cursor: 'pointer', textAlign: 'left',
                border: active ? `1.5px solid ${C.gold}` : `1px solid ${C.borderMid}`,
                background: active ? 'rgba(201,168,76,0.06)' : C.white, transition: 'all 0.15s ease' }}>
              <div>
                <div style={{ fontFamily: C.serif, fontSize: 20, fontWeight: 400, color: C.ink, lineHeight: 1.1 }}>{box.name}</div>
                <div style={{ fontSize: 10, color: C.muted, marginTop: 2 }}>{box.count} watches</div>
              </div>
              {active && <span style={{ fontSize: 9, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase', color: C.gold }}>Selected</span>}
            </button>
          );
        })}
      </div>
      {!newBoxOpen ? (
        <button onClick={() => setNewBoxOpen(true)}
          style={{ fontSize: 11, color: C.muted, background: 'none', border: 'none', cursor: 'pointer', padding: 0, letterSpacing: '0.04em' }}>+ Create New Box</button>
      ) : (
        <div style={{ display: 'flex', gap: 8, marginTop: 4 }}>
          <input value={newBoxName} onChange={e => setNewBoxName(e.target.value)} placeholder="Name your box..." autoFocus
            style={{ flex: 1, padding: '9px 12px', border: `1px solid ${C.borderMid}`, borderRadius: 6, fontSize: 13, color: C.ink, background: C.white, outline: 'none' }} />
          <button onClick={() => setNewBoxOpen(false)}
            style={{ padding: '9px 14px', background: 'transparent', border: `1px solid ${C.borderMid}`, borderRadius: 6, cursor: 'pointer', fontSize: 11, color: C.muted }}>Cancel</button>
        </div>
      )}
    </div>
  );
}

function PrimaryCTA({ choice, canAdd, sticky }) {
  const label = choice === 'owned' ? 'Add to My Collection' : 'Add to Playground';
  return (
    <button disabled={!canAdd}
      style={{ width: '100%', padding: '15px 20px', borderRadius: 6, border: 'none', cursor: canAdd ? 'pointer' : 'not-allowed',
        background: canAdd ? C.ink : C.disabled, color: C.bg, fontSize: 11.5, fontWeight: 600,
        letterSpacing: '0.1em', textTransform: 'uppercase', transition: 'background 0.15s ease',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 9,
        boxShadow: sticky ? '0 -2px 14px rgba(26,20,16,0.06)' : 'none' }}>
      {label}
      {canAdd && <span style={{ fontSize: 13 }}>→</span>}
    </button>
  );
}

// ── The form (shared between desktop & mobile) ──────────────────────────────
function AddWatchForm({ tweaks, ctaInline, mobile }) {
  const { destinationStyle, showStepNumbers } = tweaks;
  const [choice, setChoice] = useState('owned');
  const [condition, setCondition] = useState(null);
  const [selectedBoxId, setSelectedBoxId] = useState('box1');

  const canAdd = choice === 'owned' ? !!condition : !!selectedBoxId;
  const quiet = destinationStyle === 'quiet';

  // For the quiet variant, the destination decision lives inline above the details,
  // so step numbering starts at the details. Otherwise destination is step 1.
  const detailStep = quiet ? 1 : 2;

  const DestinationBlock = (
    <div style={{ marginBottom: 22 }}>
      {!quiet && <StepHeading n={1} show={showStepNumbers}>Where does it go?</StepHeading>}
      {destinationStyle === 'segmented' && <SegmentedDestination choice={choice} setChoice={setChoice} compact={mobile} />}
      {destinationStyle === 'dropdown' && <DropdownDestination choice={choice} setChoice={setChoice} />}
      {quiet && <QuietSwitchHeader choice={choice} setChoice={setChoice} />}
    </div>
  );

  return (
    <div>
      <WatchHeader />
      <EstValue />
      <div style={{ marginBottom: 24 }}><SpecsBlock /></div>
      <div style={{ height: 1, background: C.border, marginBottom: 20 }}></div>

      {DestinationBlock}

      <div key={choice} style={{ animation: 'vwbFade 0.25s ease', marginBottom: ctaInline ? 24 : 0 }}>
        {choice === 'owned' ? (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
            <ConditionPicker condition={condition} setCondition={setCondition} showStep={showStepNumbers} step={detailStep} />
            <PurchaseDetails />
          </div>
        ) : (
          <BoxPicker selectedBoxId={selectedBoxId} setSelectedBoxId={setSelectedBoxId} showStep={showStepNumbers} step={detailStep} />
        )}
      </div>

      {ctaInline && (
        <div style={{ marginTop: 24 }}>
          <PrimaryCTA choice={choice} canAdd={canAdd} />
          <p style={{ fontSize: 10.5, color: C.muted, textAlign: 'center', marginTop: 10, letterSpacing: '0.02em' }}>
            {canAdd ? 'Ready when you are.' : choice === 'owned' ? 'Select a condition to continue.' : 'Pick a box to continue.'}
          </p>
        </div>
      )}

      {/* Mobile renders the CTA in a sticky footer instead; expose state via render-prop hole */}
      {!ctaInline && <MobileCTAPortal choice={choice} canAdd={canAdd} />}
    </div>
  );
}

// Simple context bridge so the sticky mobile footer can read live form state.
const CTAContext = React.createContext(null);
function MobileCTAPortal({ choice, canAdd }) {
  const set = React.useContext(CTAContext);
  React.useEffect(() => { if (set) set({ choice, canAdd }); }, [choice, canAdd, set]);
  return null;
}

// ── Desktop layout ──────────────────────────────────────────────────────────
function DesktopView({ tweaks, followed, onFollow }) {
  return (
    <div style={{ maxWidth: 1280, margin: '0 auto', padding: '36px 56px 80px' }}>
      <button style={{ fontSize: 11, letterSpacing: '0.08em', textTransform: 'uppercase', color: C.muted, background: 'none', border: 'none', cursor: 'pointer', padding: 0, marginBottom: 28, display: 'flex', alignItems: 'center', gap: 6 }}>
        <span style={{ fontSize: 14 }}>←</span> Back to search
      </button>
      <div style={{ display: 'grid', gridTemplateColumns: 'minmax(300px, 1fr) minmax(340px, 520px)', gap: 48, alignItems: 'start' }}>
        <div style={{ position: 'sticky', top: 88 }}>
          <WatchImage followed={followed} onFollow={onFollow} />
        </div>
        <AddWatchForm tweaks={tweaks} ctaInline={true} />
      </div>
    </div>
  );
}

// ── Mobile layout (phone frame with sticky bottom CTA) ──────────────────────
function MobileView({ tweaks, followed, onFollow }) {
  const [cta, setCta] = useState({ choice: 'owned', canAdd: false });
  return (
    <div style={{ width: 390, height: 788, border: `1px solid ${C.border}`, borderRadius: 40, overflow: 'hidden',
      background: C.bg, boxShadow: '0 30px 70px rgba(26,20,16,0.18)', position: 'relative', display: 'flex', flexDirection: 'column' }}>
      {/* status bar */}
      <div style={{ height: 46, flexShrink: 0, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '0 22px', fontSize: 12, fontWeight: 600, borderBottom: `1px solid ${C.border}` }}>
        <span>9:41</span>
        <span style={{ fontFamily: C.serif, fontSize: 15, fontWeight: 500 }}>Add a Watch</span>
        <span style={{ fontSize: 11, color: C.muted, letterSpacing: '0.1em' }}>5G</span>
      </div>
      {/* scroll area */}
      <div style={{ flex: 1, overflowY: 'auto', padding: '20px 20px 16px' }}>
        <div style={{ marginBottom: 18 }}><WatchImage followed={followed} onFollow={onFollow} mobile={true} /></div>
        <CTAContext.Provider value={setCta}>
          <AddWatchForm tweaks={tweaks} ctaInline={false} mobile={true} />
        </CTAContext.Provider>
      </div>
      {/* sticky footer CTA — the ONE action */}
      <div style={{ flexShrink: 0, padding: '12px 16px 10px', background: C.bg, borderTop: `1px solid ${C.border}` }}>
        <PrimaryCTA choice={cta.choice} canAdd={cta.canAdd} sticky={true} />
        <p style={{ fontSize: 10, color: C.muted, textAlign: 'center', marginTop: 8 }}>
          {cta.canAdd ? 'Ready when you are.' : cta.choice === 'owned' ? 'Select a condition to continue.' : 'Pick a box to continue.'}
        </p>
        <div style={{ width: 124, height: 4, borderRadius: 3, background: C.ink, opacity: 0.18, margin: '6px auto 0' }}></div>
      </div>
    </div>
  );
}

// Section heading used in the side-by-side showcase
function ShowcaseLabel({ children, sub }) {
  return (
    <div style={{ textAlign: 'center', marginBottom: 18 }}>
      <div style={{ fontFamily: C.serif, fontSize: 22, fontWeight: 400, color: C.ink }}>{children}</div>
      {sub && <div style={{ fontSize: 11, color: C.muted, marginTop: 3, letterSpacing: '0.02em' }}>{sub}</div>}
    </div>
  );
}

// ── App ─────────────────────────────────────────────────────────────────────
function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [followed, setFollowed] = useState(false);
  const onFollow = () => setFollowed(true);
  const view = tweaks.preview; // 'desktop' | 'mobile' | 'both'

  const mobileFramed = (
    <div style={{ display: 'flex', justifyContent: 'center', padding: '36px 16px 64px' }}>
      <MobileView tweaks={tweaks} followed={followed} onFollow={onFollow} />
    </div>
  );

  return (
    <div>
      <NavBar />

      {view === 'desktop' && <DesktopView tweaks={tweaks} followed={followed} onFollow={onFollow} />}
      {view === 'mobile' && mobileFramed}
      {view === 'both' && (
        <div>
          <div style={{ padding: '40px 56px 8px' }}><ShowcaseLabel sub="Two-column detail layout">Desktop</ShowcaseLabel></div>
          <DesktopView tweaks={tweaks} followed={followed} onFollow={onFollow} />
          <div style={{ height: 1, background: C.border, maxWidth: 1280, margin: '8px auto' }}></div>
          <div style={{ padding: '40px 16px 8px' }}><ShowcaseLabel sub="Single column · sticky add button">Mobile</ShowcaseLabel></div>
          {mobileFramed}
        </div>
      )}

      <TweaksPanel>
        <TweakSection label="Destination control" />
        <TweakRadio label="Style" value={tweaks.destinationStyle}
          options={[
            { value: 'segmented', label: 'Switch' },
            { value: 'quiet', label: 'Quiet' },
            { value: 'dropdown', label: 'Field' },
          ]}
          onChange={v => setTweak('destinationStyle', v)} />
        <p style={{ fontSize: 10.5, color: 'rgba(41,38,27,.55)', lineHeight: 1.5, margin: '2px 0 0' }}>
          {tweaks.destinationStyle === 'segmented' && 'Recommended — identity language ("I own this") on a sliding toggle. Only the bottom button adds.'}
          {tweaks.destinationStyle === 'quiet' && 'One default path. Playground is a quiet inline link, not a competing button.'}
          {tweaks.destinationStyle === 'dropdown' && 'Destination as a labeled form field — clearly an input, never mistaken for the action.'}
        </p>
        <TweakSection label="Wayfinding" />
        <TweakToggle label="Step numbers" value={tweaks.showStepNumbers} onChange={v => setTweak('showStepNumbers', v)} />
        <TweakSection label="Preview" />
        <TweakRadio label="Layout" value={tweaks.preview}
          options={[{ value: 'both', label: 'Both' }, { value: 'desktop', label: 'Desktop' }, { value: 'mobile', label: 'Mobile' }]}
          onChange={v => setTweak('preview', v)} />
      </TweaksPanel>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
