<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strap Drawer — Mobile — Virtual Watchbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #F4EFE6; color: #1A1410;
    font-family: 'DM Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
    background-image: radial-gradient(circle at 20% 0%, #FAF8F4 0%, #F4EFE6 60%);
  }
  ::-webkit-scrollbar { height: 8px; width: 8px; }
  ::-webkit-scrollbar-thumb { background: #D4CBBF; border-radius: 4px; }
</style>
</head>
<body>
<div id="root"></div>

<template id="__bundler_thumbnail">
  <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
    <rect width="100" height="100" fill="#1A1410"/>
    <rect x="38" y="22" width="24" height="56" rx="6" fill="#FFFCF7"/>
    <rect x="46" y="30" width="8" height="40" rx="3" fill="#C9A84C"/>
  </svg>
</template>

<script type="text/babel" src="strap_drawer/ios-frame.jsx"></script>
<script type="text/babel" data-presets="env,react">
const SERIF = "'Cormorant Garamond', Georgia, serif";
const SANS = "'DM Sans', system-ui, sans-serif";
const GOLD = '#C9A84C', INK = '#1A1410', MUTED = '#A89880', MUTEDD = '#6F6353', BORDER = '#E0D8CC';
const S = 0.66;

const Phone = ({ src, n, label, sub }) =>
  React.createElement('div', { style: { display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20, flexShrink: 0 } },
    React.createElement('div', { style: { width: 402 * S, height: 874 * S, position: 'relative' } },
      React.createElement('div', { style: { position: 'absolute', top: 0, left: 0, transform: `scale(${S})`, transformOrigin: 'top left' } },
        React.createElement(IOSDevice, null,
          React.createElement('div', { style: { display: 'flex', flexDirection: 'column', height: '100%' } },
            React.createElement('div', { style: { height: 60, flexShrink: 0, background: '#FAF8F4' } }),
            React.createElement('iframe', { src, title: label, style: { flex: 1, width: '100%', border: 'none', background: '#FAF8F4' } }),
          ),
        ),
      ),
    ),
    React.createElement('div', { style: { textAlign: 'center', maxWidth: 250 } },
      React.createElement('div', { style: { display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 6 } },
        React.createElement('span', { style: { fontFamily: SERIF, fontStyle: 'italic', fontSize: 15, color: GOLD } }, n),
        React.createElement('h3', { style: { fontFamily: SERIF, fontSize: 21, fontWeight: 400, color: INK, margin: 0, whiteSpace: 'nowrap' } }, label),
      ),
      React.createElement('p', { style: { fontFamily: SANS, fontSize: 12, color: MUTEDD, lineHeight: 1.5, margin: 0, textWrap: 'pretty' } }, sub),
    ),
  );

const App = () =>
  React.createElement('div', { style: { minHeight: '100vh', padding: '56px 40px 80px' } },
    React.createElement('div', { style: { maxWidth: 1180, margin: '0 auto' } },
      // Header
      React.createElement('div', { style: { marginBottom: 12 } },
        React.createElement('div', { style: { fontFamily: SANS, fontSize: 10, fontWeight: 600, letterSpacing: '0.18em', textTransform: 'uppercase', color: GOLD, marginBottom: 12 } }, 'Virtual Watchbox \u00b7 The Strap Drawer'),
        React.createElement('h1', { style: { fontFamily: SERIF, fontSize: 52, fontWeight: 300, letterSpacing: '-0.02em', lineHeight: 1, color: INK, margin: '0 0 16px' } }, 'On the phone'),
        React.createElement('p', { style: { fontFamily: SERIF, fontStyle: 'italic', fontSize: 19, color: MUTEDD, lineHeight: 1.5, maxWidth: 580, margin: 0, textWrap: 'pretty' } },
          'The same drawer, rebuilt for the wrist you check it on. Cards stack to one column, filters scroll sideways, the Fit Finder becomes a swipeable rail, and every panel becomes a bottom sheet. Each phone below is live \u2014 tap through it.'),
        React.createElement('a', { href: 'Strap Drawer.html', style: { display: 'inline-flex', alignItems: 'center', gap: 7, marginTop: 22, fontFamily: SANS, fontSize: 11, fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase', color: INK, textDecoration: 'none', border: `1px solid #D4CBBF`, borderRadius: 4, padding: '10px 18px' } }, 'View the web version \u2192'),
      ),
      // Phones rail
      React.createElement('div', { style: { display: 'flex', gap: 44, flexWrap: 'wrap', justifyContent: 'center', marginTop: 48 } },
        React.createElement(Phone, { src: 'Strap Drawer.html', n: '01', label: 'Browse', sub: 'Stacked cards, a sticky Add button, and sideways-scrolling material & width filters.' }),
        React.createElement(Phone, { src: 'Strap Drawer.html#watch=tudor-bb-gmt', n: '02', label: 'Fit Finder', sub: 'Pick a watch from the rail and the drawer narrows to just the straps that fit it.' }),
        React.createElement(Phone, { src: 'Strap Drawer.html#strap=str-allig-black', n: '03', label: 'Strap detail', sub: 'The detail panel rises as a bottom sheet \u2014 specs, purchase link, and which watches it fits.' }),
        React.createElement(Phone, { src: 'Strap Drawer.html#add', n: '04', label: 'Add a strap', sub: 'A full-height sheet with the live swatch preview pinned beside the material and width pickers.' }),
        React.createElement(Phone, { src: 'Strap Drawer.html#empty', n: '05', label: 'Empty drawer', sub: 'The first-run state that invites the collector to track their first strap.' }),
      ),
    ),
  );

(function mount() {
  if (!window.IOSDevice) return setTimeout(mount, 30);
  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();
</script>
</body>
</html>
