<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Service Room — Virtual Watchbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #FAF8F4; }
  body { color: #1A1410; font-family: 'DM Sans', system-ui, sans-serif; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  button { font: inherit; } a { text-decoration: none; color: inherit; } img { display: block; }
  input, textarea { font: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #D4CBBF; border-radius: 4px; }
  #root { min-height: 100vh; }
  .vw-loading { min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Cormorant Garamond', serif; font-size: 22px; color: #C9A84C; letter-spacing: 0.04em; }
</style>
</head>
<body>
<div id="root"><div class="vw-loading">The Service Room</div></div>

<script type="text/babel" src="service-data.jsx"></script>
<script type="text/babel" src="hub-core.jsx"></script>
<script type="text/babel" src="dossier-export.jsx"></script>
<script type="text/babel" src="ServiceHorizon.jsx"></script>
<script type="text/babel" src="HubAgenda.jsx"></script>
<script type="text/babel" src="HubLedger.jsx"></script>
<script type="text/babel" src="HubGallery.jsx"></script>
<script type="text/babel" src="WatchDrawer.jsx"></script>
<script type="text/babel" src="LogServiceModal.jsx"></script>
<script type="text/babel" src="MaintenanceHub.jsx"></script>

<script type="text/babel" data-presets="env,react">
(function mount() {
  if (!window.MaintenanceHub || !window.COLLECTION || !window.serviceStatus) {
    return setTimeout(mount, 30);
  }
  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(React.createElement(window.MaintenanceHub));
})();
</script>
</body>
</html>
